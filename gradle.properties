org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
kotlin.incremental=true
kotlin.native.cacheKind.linuxX64=none
android.useAndroidX=true
android.nonTransitiveRClass=true
# Transitional AGP 9 fallback for this mixed Android/KMP build. The app uses the
# explicit Kotlin Android plugin while shared modules retain Kotlin Multiplatform.
# Remove both switches after migrating shared Android targets to the Android-KMP plugin.
android.builtInKotlin=false
android.newDsl=false
